<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Chat App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 18px 60px rgba(0,0,0,0.08);
            padding: 24px;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        #messages {
            min-height: 320px;
            max-height: 440px;
            overflow-y: auto;
            border: 1px solid #dde3ee;
            border-radius: 12px;
            padding: 16px;
            background: #f8fbff;
        }
        .message {
            margin-bottom: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
        }
        .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        form {
            display: grid;
            gap: 12px;
            margin-top: 18px;
        }
        input, textarea, button {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #d3d9eb;
            padding: 12px;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            background: #3b82f6;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Local Chat App</h1>
        <div id="messages"></div>
        <form id="chatForm">
            <input id="sender" type="text" placeholder="Your name" value="Anonymous" />
            <textarea id="message" rows="3" placeholder="Type your message..."></textarea>
            <button type="submit">Send message</button>
        </form>
    </div>
    <script>
        const messagesEl = document.getElementById('messages');
        const form = document.getElementById('chatForm');
        const senderInput = document.getElementById('sender');
        const messageInput = document.getElementById('message');
        let lastId = 0;

        function addMessage(message) {
            const item = document.createElement('div');
            item.className = 'message';
            item.innerHTML = `
                <div class="meta"><strong>${message.sender}</strong> • ${message.timestamp}</div>
                <div>${message.text}</div>
            `;
            messagesEl.appendChild(item);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function pollMessages() {
            try {
                const response = await fetch(`/poll?after=${lastId}`);
                if (!response.ok) return;
                const data = await response.json();
                if (Array.isArray(data) && data.length) {
                    data.forEach(addMessage);
                    lastId = data[data.length - 1].id;
                }
            } catch (error) {
                console.error('Polling error', error);
            }
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const sender = senderInput.value.trim() || 'Anonymous';
            const text = messageInput.value.trim();
            if (!text) return;

            await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `sender=${encodeURIComponent(sender)}&message=${encodeURIComponent(text)}`,
            });

            messageInput.value = '';
            pollMessages();
        });

        pollMessages();
        setInterval(pollMessages, 1000);
    </script>
</body>
</html>
